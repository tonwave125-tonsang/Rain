<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Simple Mobile AR Lab - Thunderstorm Warning</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
    }

    #top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 560px);
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.70);
      color: white;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 12px;
    }

    button {
      min-width: 145px;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    #show-button { background: #ffffff; color: #111111; }
    #status-button { background: #ffd54f; color: #111111; }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.82;
    }
  </style>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const marker = document.querySelector('#hiro-marker');
      const stormGroup = document.querySelector('#storm-group');
      const clouds = document.querySelectorAll('.storm-cloud');
      const lightning = document.querySelector('#lightning');
      const rain = document.querySelector('#rain-group');
      const arLabel = document.querySelector('#ar-label');
      const topPanel = document.querySelector('#top-panel');
      const showButton = document.querySelector('#show-button');
      const statusButton = document.querySelector('#status-button');
      const rainDrops = document.querySelectorAll('.rain-drop');

      let visible = true;
      let warning = true;
      let lightningTimer = null;

      function scheduleLightningFlash() {
        clearTimeout(lightningTimer);
        const delay = 900 + Math.random() * 1800;
        lightningTimer = setTimeout(() => {
          if (warning && visible) {
            lightning.setAttribute('visible', true);
            setTimeout(() => lightning.setAttribute('visible', false), 90);
            setTimeout(() => lightning.setAttribute('visible', true), 170);
            setTimeout(() => lightning.setAttribute('visible', false), 260);
          }
          scheduleLightningFlash();
        }, delay);
      }

      scheduleLightningFlash();

      marker.addEventListener('markerFound', () => {
        topPanel.innerHTML = 'พบ Hiro Marker แล้ว — แสดงภาพฝนฟ้าคะนองแบบ Animation<span class="hint">ใช้ปุ่มด้านล่างเพื่อซ่อนภาพหรือเปลี่ยนสถานะคำเตือน</span>';
      });

      marker.addEventListener('markerLost', () => {
        topPanel.innerHTML = 'เล็งกล้องไปที่ Hiro Marker<span class="hint">วาง Marker ให้ราบ มีแสงเพียงพอ และเห็นกรอบดำครบทั้งสี่ด้าน</span>';
      });

      showButton.addEventListener('click', () => {
        visible = !visible;
        stormGroup.setAttribute('visible', visible);
        if (!visible) lightning.setAttribute('visible', false);
        showButton.textContent = visible ? 'ซ่อนภาพพายุ' : 'แสดงภาพพายุ';
      });

      statusButton.addEventListener('click', () => {
        warning = !warning;

        if (warning) {
          clouds.forEach(el => el.setAttribute('color', '#455a64'));
          lightning.setAttribute('visible', false);
          rain.setAttribute('visible', true);
          arLabel.setAttribute('value', 'THUNDERSTORM WARNING\nHEAVY RAIN & LIGHTNING');
          arLabel.setAttribute('color', '#ffeb3b');
          statusButton.textContent = 'เปลี่ยนเป็นเฝ้าระวัง';
          topPanel.innerHTML = '⚠️ คำเตือน: มีฝนฟ้าคะนอง<span class="hint">ระวังฝนตกหนัก ลมแรง และฟ้าผ่า</span>';
        } else {
          clouds.forEach(el => el.setAttribute('color', '#90a4ae'));
          lightning.setAttribute('visible', false);
          rain.setAttribute('visible', true);
          arLabel.setAttribute('value', 'WEATHER WATCH\nRAIN POSSIBLE');
          arLabel.setAttribute('color', '#ffffff');
          statusButton.textContent = 'เปิดคำเตือนพายุ';
          topPanel.innerHTML = 'สถานะเฝ้าระวังสภาพอากาศ<span class="hint">มีโอกาสเกิดฝน โปรดติดตามสภาพอากาศ</span>';
        }
      });
    });
  </script>
</head>

<body>
  <div id="top-panel">
    เล็งกล้องไปที่ Hiro Marker
    <span class="hint">อนุญาตให้เว็บไซต์ใช้กล้องเมื่อเบราว์เซอร์ถาม</span>
  </div>

  <div id="controls">
    <button id="show-button" type="button">ซ่อนภาพพายุ</button>
    <button id="status-button" type="button">เปลี่ยนเป็นเฝ้าระวัง</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false"
  >
    <a-marker
      id="hiro-marker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smooth-count="8"
      smooth-tolerance="0.01"
      smooth-threshold="3"
    >
      <a-entity id="storm-group" position="0 0.10 0">
        <!-- ฐานพื้นหลัง เพื่อให้ภาพพายุมองเห็นชัด -->
        <a-plane
          position="0 0.01 0"
          rotation="-90 0 0"
          width="1.45"
          height="1.05"
          color="#0d1b2a"
          opacity="0.78"
          material="transparent: true; side: double"
          animation="property: material.opacity; from: 0.68; to: 0.82; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine"
        ></a-plane>

        <!-- กลุ่มก้อนเมฆ -->
        <a-sphere class="storm-cloud" position="-0.33 0.62 0" scale="0.55 0.30 0.30" color="#455a64" animation="property: position; from: -0.40 0.62 0; to: -0.25 0.65 0; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine"></a-sphere>
        <a-sphere class="storm-cloud" position="0.00 0.72 0" scale="0.70 0.38 0.36" color="#455a64" animation="property: position; from: -0.08 0.72 0; to: 0.08 0.76 0; dir: alternate; dur: 2600; loop: true; easing: easeInOutSine"></a-sphere>
        <a-sphere class="storm-cloud" position="0.34 0.61 0" scale="0.55 0.30 0.30" color="#455a64" animation="property: position; from: 0.25 0.61 0; to: 0.43 0.64 0; dir: alternate; dur: 2400; loop: true; easing: easeInOutSine"></a-sphere>
        <a-sphere class="storm-cloud" position="0.02 0.55 0" scale="0.95 0.28 0.34" color="#455a64" animation="property: scale; from: 0.90 0.27 0.34; to: 1.00 0.30 0.36; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"></a-sphere>

        <!-- สายฟ้า -->
        <a-entity id="lightning" position="0.05 0.22 0.03" visible="false" animation="property: scale; from: 0.92 0.92 0.92; to: 1.08 1.08 1.08; dir: alternate; dur: 120; loop: true">
          <a-triangle
            vertex-a="-0.08 0.28 0"
            vertex-b="0.13 0.28 0"
            vertex-c="-0.02 -0.02 0"
            color="#ffeb3b"
            material="emissive: #ffeb3b; emissiveIntensity: 1"
          ></a-triangle>
          <a-triangle
            vertex-a="-0.02 0.03 0"
            vertex-b="0.14 0.03 0"
            vertex-c="-0.12 -0.34 0"
            color="#ffc107"
            material="emissive: #ffc107; emissiveIntensity: 1"
          ></a-triangle>
        </a-entity>

        <!-- เม็ดฝน -->
        <a-entity id="rain-group">
          <a-box class="rain-drop" position="-0.45 0.38 0.02" width="0.025" height="0.24" depth="0.018" rotation="0 0 -18" color="#4fc3f7" animation="property: position; from: -0.45 0.38 0.02; to: -0.60 -0.12 0.02; dur: 780; delay: 0; loop: true; easing: linear"></a-box>
          <a-box class="rain-drop" position="-0.27 0.32 0.02" width="0.025" height="0.24" depth="0.018" rotation="0 0 -18" color="#4fc3f7" animation="property: position; from: -0.27 0.32 0.02; to: -0.42 -0.16 0.02; dur: 920; delay: 180; loop: true; easing: linear"></a-box>
          <a-box class="rain-drop" position="-0.08 0.40 0.02" width="0.025" height="0.24" depth="0.018" rotation="0 0 -18" color="#4fc3f7" animation="property: position; from: -0.08 0.40 0.02; to: -0.23 -0.10 0.02; dur: 700; delay: 90; loop: true; easing: linear"></a-box>
          <a-box class="rain-drop" position="0.20 0.34 0.02" width="0.025" height="0.24" depth="0.018" rotation="0 0 -18" color="#4fc3f7" animation="property: position; from: 0.20 0.34 0.02; to: 0.05 -0.15 0.02; dur: 860; delay: 300; loop: true; easing: linear"></a-box>
          <a-box class="rain-drop" position="0.40 0.42 0.02" width="0.025" height="0.24" depth="0.018" rotation="0 0 -18" color="#4fc3f7" animation="property: position; from: 0.40 0.42 0.02; to: 0.25 -0.08 0.02; dur: 760; delay: 220; loop: true; easing: linear"></a-box>
          <a-box class="rain-drop" position="-0.60 0.46 0.02" width="0.02" height="0.20" depth="0.015" rotation="0 0 -18" color="#81d4fa" animation="property: position; from: -0.60 0.46 0.02; to: -0.75 -0.04 0.02; dur: 840; delay: 420; loop: true; easing: linear"></a-box>
          <a-box class="rain-drop" position="0.58 0.36 0.02" width="0.02" height="0.20" depth="0.015" rotation="0 0 -18" color="#81d4fa" animation="property: position; from: 0.58 0.36 0.02; to: 0.43 -0.14 0.02; dur: 800; delay: 120; loop: true; easing: linear"></a-box>
          <a-box class="rain-drop" position="0.04 0.50 0.02" width="0.02" height="0.20" depth="0.015" rotation="0 0 -18" color="#81d4fa" animation="property: position; from: 0.04 0.50 0.02; to: -0.11 0.00 0.02; dur: 740; delay: 510; loop: true; easing: linear"></a-box>
        </a-entity>

        <!-- ข้อความเตือน -->
        <a-text
          id="ar-label"
          value="THUNDERSTORM WARNING\nHEAVY RAIN & LIGHTNING"
          position="0 1.12 0"
          rotation="-90 0 0"
          align="center"
          width="2.5"
          color="#ffeb3b"
          side="double"
          animation="property: scale; from: 1 1 1; to: 1.04 1.04 1.04; dir: alternate; dur: 650; loop: true; easing: easeInOutSine"
        ></a-text>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
